<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - GlucoSense</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>
<body>
    <!-- Minimal Header -->
    <header class="login-header">
        <a href="{% url 'pages:home' %}" class="login-logo">
            Gluco<span>Sense</span>
        </a>

        <div class="login-header__icons">
            <button title="Help">?</button>
            <button title="Info">i</button>
        </div>
    </header>

    <section class="signup-page">

        <div class="signup-card">

            <div class="signup-header">
                <h1>Create your account</h1>
                <p>
                    Join GlucoSense and start managing your health journey.
                </p>
            </div>

            <form id="signupForm" class="signup-form">

                <div class="form-group">
                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Choose a username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="fullName" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        class="form-control"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="diabetesType" class="form-label">
                        Diabetes Type
                    </label>

                    <select
                        id="diabetesType"
                        class="form-control"
                        required
                    >
                        <option value="">Select diabetes type</option>
                        <option value="Type 1">Type 1</option>
                        <option value="Type 2">Type 2</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div
                    id="signupMessage"
                    class="signup-message"
                ></div>

                <button
                    type="submit"
                    class="btn btn-primary signup-submit"
                >
                    Create Account
                </button>

            </form>

            <div class="signup-login">
                Already have an account?
                <a href="{% url 'accounts:login' %}">
                    Log in
                </a>
            </div>

        </div>

    </section>

    <script src="{% static 'js/signup.js' %}"></script>
</body>
</html>
